# Dependabot version updates (https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference).
# Once a week, at most one pull request per ecosystem: the npm dev dependencies (with
# package-lock.json updated, since the dev machine has no Node) and the GitHub Actions,
# whose commit SHAs and "# vX.Y.Z" comments it updates together.
# A new release waits 7 days first, so a broken or hijacked version is usually pulled by then.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
