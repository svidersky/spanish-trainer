# Deploys the Sync server (worker/) to Cloudflare when it changes on main.
# Per https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/
# Secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set in the repository settings.
name: Deploy Sync server

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions: {}

# One deploy at a time; a newer one waits instead of cancelling a deploy half-way.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
